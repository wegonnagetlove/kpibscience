<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Масштаб исследований кафедры компьютерного права и информационной безопасности</title>
<meta name="description" content="Интерактивная шкала научных работ сотрудников кафедры компьютерного права и информационной безопасности ВШГА МГУ: от единицы данных до глобальной информационной среды.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Масштаб исследований</h1>
    <p class="sub">Кафедра компьютерного права и информационной безопасности ВШГА МГУ</p>
  </div>
  <div class="top-right">
    <nav class="views" aria-label="Вид">
      <button class="vbtn is-on" data-view="scale" type="button">Шкала</button>
      <button class="vbtn" data-view="list" type="button">Список</button>
      <button class="vbtn" data-view="about" type="button">О проекте</button>
    </nav>
    <div class="dots" aria-hidden="true"><i class="c-blue"></i><i class="c-red"></i><i class="c-yellow"></i><i class="c-green"></i></div>
  </div>
</header>

<section class="filters" aria-label="Фильтр по сотрудникам">
  <div class="left-tools"><input id="search" type="search" placeholder="Поиск по заглавию, журналу, году" aria-label="Поиск"><div id="people" class="chips"></div></div>
  <div class="legend" id="legend"></div>
</section>

<main id="stage" class="stage" aria-label="Шкала исследований" tabindex="0"></main>

<section id="list" class="list" hidden></section>
<section id="about" class="about" hidden></section>

<footer class="dock" id="dock">
  <div class="readout">
    <span class="lvl-num" id="lvlNum">2</span>
    <div>
      <div class="lvl-name" id="lvlName">Государство</div>
      <div class="lvl-hint" id="lvlHint"></div>
    </div>
    <button class="lvl-open" id="lvlOpen" type="button">Список</button>
  </div>
  <div class="slider-wrap">
    <button class="zbtn" id="zoomOut" type="button" aria-label="Мельче">−</button>
    <div class="track">
      <input id="zoom" type="range" min="-3.4" max="4.4" step="0.001" value="2" aria-label="Масштаб">
      <div class="ticks" id="ticks"></div>
    </div>
    <button class="zbtn" id="zoomIn" type="button" aria-label="Крупнее">+</button>
  </div>
</footer>

<aside id="panel" class="panel" aria-hidden="true">
  <button class="close" id="panelClose" type="button" aria-label="Закрыть">×</button>
  <div id="panelBody"></div>
</aside>

<div id="hint" class="hint">Прокручивайте колесо, двигайте ползунок или проводите пальцем, чтобы менять масштаб. Нажмите на точку, чтобы открыть карточку работы.</div>

<script src="data/research.js"></script>
<script src="data/works.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
